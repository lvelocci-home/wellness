<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Wellness Tracker</title>
<style>
:root{
  --bg:#eef2f5; --bg2:#f7f9fb; --card:#ffffff; --line:#e2e8ee; --line2:#d3dce4;
  --ink:#16242f; --ink2:#56697a; --ink3:#90a2b1;
  --accent:#0eb39a; --accent-d:#0a8f7c; --accent-bg:#e2f6f2;
  --blue:#2f78d6; --blue-bg:#e6f0fb;
  --cal:#0eb39a; --pro:#2bb673; --carb:#f0a821; --fat:#8b6cf0; --fiber:#c2703d;
  --good:#2bb673; --warn:#e8833a; --bad:#e0566b;
  --radius:16px; --radius-sm:10px; --nav-h:62px;
  --shadow:0 1px 3px rgba(20,36,47,.06),0 4px 16px rgba(20,36,47,.06);
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;overflow-x:hidden}
main{padding-bottom:34px;min-height:100vh}
.page{display:none;max-width:1280px;margin:0 auto;padding:14px 28px 30px}
@media(max-width:720px){.page{padding-left:14px;padding-right:14px}}
.page.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* App bar (top) */
.appbar{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--line)}
.bar-top{display:flex;align-items:center;gap:10px;max-width:1280px;margin:0 auto;padding:12px 28px 4px}
@media(max-width:720px){.bar-top{padding-left:16px;padding-right:16px}}
.bar-top h1{font-size:23px;font-weight:800;letter-spacing:-.5px;flex:1;cursor:pointer}
.bar-top h1 b{color:var(--accent)}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink2)}
.icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs{display:flex;max-width:1280px;margin:0 auto;padding:2px 8px 6px}
nav.tabs button{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 4px;color:var(--ink3);font-size:10px;font-weight:700;font-family:var(--font);border-radius:10px}
nav.tabs button.active{color:var(--accent)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* Dashboard (home) */
.hero{padding:8px 4px 14px}
.hero .greet{font-size:13px;color:var(--ink2);font-weight:600}
.hero h2{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:1px 0 2px}
.hero .hdate{font-size:13px;color:var(--ink3);font-weight:600}
.dash{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:11px;box-shadow:var(--shadow);cursor:pointer}
.dash:active{transform:scale(.99)}
.dash .dicon{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
.dash .dbody{flex:1;min-width:0}
.dash .dlabel{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3)}
.dash .dstat{font-size:19px;font-weight:800;margin-top:1px}
.dash .dstat small{font-size:13px;font-weight:600;color:var(--ink3)}
.dash .dsub{font-size:12px;color:var(--ink2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dash .dchev{color:var(--ink3);font-size:22px;font-weight:300}
.dbar{height:7px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:7px}
.dbar>i{display:block;height:100%;border-radius:5px}
.streak{font-size:13px;font-weight:700;color:var(--warn)}
.vf-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:11px}
@media(max-width:720px){.vf-row{grid-template-columns:1fr}}
.vf-row .vision,.vf-row .dash{margin-bottom:0;height:100%}
.vision{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;border-radius:var(--radius);padding:16px 18px;margin-bottom:11px;cursor:pointer;box-shadow:var(--shadow)}
.vision .vlabel{font-size:10px;font-weight:800;letter-spacing:1.2px;opacity:.85}
.vision .vtext{font-size:16px;font-weight:600;line-height:1.45;margin-top:5px;font-style:italic}
.vision .vtext.empty{opacity:.8;font-style:normal;font-weight:500}
.focusline .dstat{font-size:15px!important;font-weight:600!important;white-space:normal!important}
.wm-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:11px}
@media(max-width:720px){.wm-row{grid-template-columns:1fr}}
.wm-row .dash{margin-bottom:0;height:100%}
.med-card{cursor:pointer;transition:.15s}
.med-card.med-done{background:#f6f2ff;border-color:#dccff5}
.med-card.med-done .dstat{color:var(--fat)}
.med-check{width:34px;height:34px;border-radius:10px;border:2px solid var(--line2);flex:none;display:flex;align-items:center;justify-content:center;background:var(--card);transition:.15s;align-self:center}
.med-check svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.med-check.on{background:var(--fat);border-color:var(--fat)}
.med-check.on svg{opacity:1}
.watbtns{display:flex;gap:6px;margin-top:9px}
.watbtns button{flex:1;border:1px solid #bcd9f2;background:var(--blue-bg);color:var(--blue);font-weight:700;font-size:13px;font-family:var(--font);padding:7px 4px;border-radius:9px;cursor:pointer}
.watbtns button:active{transform:scale(.96)}
.watbtns button.minus{flex:0 0 42px;color:var(--ink2);background:var(--bg2);border-color:var(--line2)}
textarea.inp{resize:vertical;font-family:var(--font);line-height:1.45}

/* Cards & bits */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink2);margin-bottom:11px;font-weight:700;display:flex;align-items:center;gap:7px}
.muted{color:var(--ink2)}.tiny{font-size:12px;color:var(--ink3)}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--accent-bg);color:var(--accent-d)}
.sel,.inp{font-family:var(--font);font-size:15px;color:var(--ink);background:var(--bg2);border:1px solid var(--line2);border-radius:var(--radius-sm);padding:10px 12px;width:100%}
.sel{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%2356697a' stroke-width='2'><path d='M4 6l4 4 4-4'/></svg>");background-repeat:no-repeat;background-position:right 12px center}
button.btn{font-family:var(--font);font-weight:700;font-size:14px;border:none;border-radius:var(--radius-sm);padding:11px 15px;cursor:pointer;background:var(--accent);color:#fff}
button.btn.sec{background:var(--bg2);color:var(--ink);border:1px solid var(--line2)}
button.btn.ghost{background:none;color:var(--accent-d);padding:8px 4px}
button.btn:active{transform:scale(.98)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.fld{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:10px 0 4px}

/* Grocery */
.aisle{margin-bottom:6px}
.aisle .ah{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--accent-d);padding:12px 2px 4px}
.gitem{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
.gitem:last-child{border-bottom:none}
.check{width:24px;height:24px;border-radius:7px;border:2px solid var(--line2);flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--card);transition:.12s}
.check svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.gitem.done .check{background:var(--accent);border-color:var(--accent)}
.gitem.done .check svg{opacity:1}
.gitem .gname{flex:1;font-weight:600;font-size:15px}
.gitem .gqty{font-size:13px;color:var(--ink2);font-weight:600;white-space:nowrap}
.gitem.done .gname,.gitem.done .gqty{color:var(--ink3);text-decoration:line-through}
.gitem .xrm{color:var(--ink3);cursor:pointer;font-size:18px;padding:0 4px}
.progress{height:9px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-d));border-radius:6px;transition:width .3s}
details.have{margin-top:8px}
details.have summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--ink2);padding:8px 2px;list-style:none}
details.have summary::-webkit-details-marker{display:none}

/* Macro rings */
.rings{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center}
.ring{position:relative;width:100%;max-width:88px;margin:0 auto}
.ring svg{width:100%;height:auto;transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .rv b{font-size:15px;font-weight:800;line-height:1}
.ring .rv span{font-size:9px;color:var(--ink3);margin-top:1px}
.rlabel{font-size:11px;font-weight:700;color:var(--ink2);margin-top:5px}
.rrem{font-size:10px;color:var(--ink3)}

/* meal cards */
.meal{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:none}
.meal .mn{flex:1}
.meal .mn b{font-weight:700;font-size:14px}
.meal .mn .mm{font-size:12px;color:var(--ink2);margin-top:2px}
.meal.eaten .mn b{color:var(--accent-d)}
/* Recipes */
.recipe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.recipe-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.recipe-head{display:flex;gap:10px;align-items:flex-start}
.recipe-name{font-size:15px;font-weight:700;line-height:1.3}
.recipe-plan{font-size:11px;font-weight:600;color:var(--accent-d);margin-top:3px;text-transform:uppercase;letter-spacing:.4px}
.recipe-macros{text-align:right;flex:none;white-space:nowrap}
.rm-cal b{font-size:20px;font-weight:800}.rm-cal span{font-size:11px;color:var(--ink3);margin-left:3px}
.rm-line{font-size:12px;font-weight:700;margin-top:1px}
.recipe-ings{margin-top:10px;border-top:1px dashed var(--line);padding-top:6px}
.recipe-ings .ming{padding:3px 0;border-bottom:none}
.warmup{font-size:12px;color:var(--ink2);font-style:italic;padding:4px 4px 9px 14px;border-bottom:1px solid var(--line);margin-bottom:4px}
.added-tag{font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--accent-d);background:var(--accent-bg);padding:2px 5px;border-radius:5px;vertical-align:middle}
.fib-chip{color:var(--fiber);font-weight:600;cursor:pointer;padding:1px 4px;border-radius:4px;white-space:nowrap}
.fib-chip.est{border-bottom:1px dotted var(--fiber)}
.fib-chip:hover{background:rgba(194,112,61,.12)}
.meal-time{color:var(--accent-d);font-weight:600;cursor:pointer;padding:1px 4px;border-radius:4px;white-space:nowrap}
.meal-time:hover{background:var(--accent-bg)}
.if-card h2{margin-bottom:8px}
.reveal-wrap{position:relative}
.reveal-wrap .reveal-inp{padding-right:44px;letter-spacing:.5px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.reveal-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:18px;line-height:1;cursor:pointer;padding:8px 10px;opacity:.55;border-radius:6px}
.reveal-btn:hover{opacity:1;background:var(--bg2)}
.swap-line{font-size:13px;font-weight:600;color:var(--blue);background:var(--blue-bg);border-radius:8px;padding:8px 12px;margin:6px 0 4px;display:flex;align-items:center;gap:6px}
.swap-line .sw-rm{margin-left:auto;cursor:pointer;color:var(--blue);font-size:18px;line-height:1;padding:0 4px}
.skip-line{font-size:13px;color:var(--ink3);padding:8px 4px;border-top:1px dashed var(--line);display:flex;align-items:center;gap:6px}
.skip-line b{font-weight:600;text-decoration:line-through}
.skip-line .sk-rs{margin-left:auto;cursor:pointer;color:var(--accent-d);font-weight:700}
.cardio{font-size:13px;font-weight:600;color:var(--warn);padding:11px 4px 2px 14px;margin-top:4px;border-top:1px dashed var(--line)}
.split{display:grid;grid-template-columns:2fr 1fr;gap:14px;align-items:start}
.split .col-side .card:first-child{margin-top:0}
@media(max-width:720px){.split{grid-template-columns:1fr}}
.mealinfo{background:none;border:none;color:var(--ink3);font-size:13px;cursor:pointer;padding:6px 4px;flex:none}
.mealings{padding:2px 6px 12px 50px;animation:fade .15s ease}
.ming{display:flex;gap:12px;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line)}
.ming:last-child{border-bottom:none}
.ming .mq{min-width:72px;color:var(--accent-d);font-weight:700}

/* exercises */
.day{margin-bottom:10px}
.day .dh{display:flex;align-items:center;gap:10px;padding:10px 2px}
.day .dh b{flex:1;font-size:15px;font-weight:700}
.ex{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:7px 4px 7px 14px;font-size:14px;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:none}
.ex a{color:var(--ink);text-decoration:none;font-weight:600;border-bottom:1px dotted var(--line2)}
.ex a:hover{color:var(--accent-d)}
.ex .sr{margin-left:auto;font-size:12px;color:var(--ink2);font-weight:600;white-space:nowrap}
.ex .set-boxes{display:inline-flex;gap:5px;flex:none}
.set-box{width:20px;height:20px;border:1.5px solid var(--line2);border-radius:5px;cursor:pointer;background:var(--card);display:inline-flex;align-items:center;justify-content:center;transition:.1s}
.set-box:hover{border-color:var(--accent)}
.set-box.on{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent-d)}
.set-box.on::after{content:'✓';color:#fff;font-weight:800;font-size:12px;line-height:1}
.ex .wt-wrap{display:inline-flex;align-items:center;gap:6px;flex:none}
.wt-inp{width:52px;font-size:12px;padding:4px 6px;border:1px solid var(--line2);border-radius:6px;background:var(--card);text-align:center;font-family:inherit;color:var(--ink)}
.wt-inp:focus{outline:2px solid var(--accent-bg);border-color:var(--accent)}
.wt-inp::-webkit-outer-spin-button,.wt-inp::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.wt-last{font-size:11px;color:var(--ink3);cursor:pointer;padding:2px 6px;border-radius:5px;background:var(--bg2);white-space:nowrap}
.wt-last:hover{background:var(--accent-bg);color:var(--accent-d)}
.wt-up{color:var(--good);font-weight:800;font-size:11px}
.wt-dn{color:var(--bad);font-weight:800;font-size:11px}
.grp-head{padding:10px 4px 6px 14px;margin-top:8px;border-top:1px solid var(--line)}
.grp-head:first-of-type{border-top:none;margin-top:0}
.grp-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink)}
.grp-badge{font-size:9px;font-weight:800;letter-spacing:1px;padding:2px 7px;border-radius:10px;color:#fff}
.grp-badge.circuit{background:var(--warn)}
.grp-badge.super{background:var(--fat)}
.grp-badge.straight{background:var(--accent-d)}
.grp-meta{font-size:12px;color:var(--ink2);font-weight:600;margin-top:2px}
.grp-note{font-size:12px;color:var(--ink2);font-style:italic;margin-top:5px;background:var(--bg2);padding:6px 10px;border-radius:6px}
.rest{padding:14px;text-align:center;color:var(--ink3);font-style:italic;font-size:13px}
.act{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.act:last-child{border-bottom:none}
.act .aemoji{width:30px;text-align:center;font-size:17px}
.act .an{flex:1}.act .an b{font-size:14px;font-weight:700}.act .an .am{font-size:12px;color:var(--ink2)}
.act .astat{font-size:12px;color:var(--ink2);text-align:right;font-weight:600}

/* table */
.thist{width:100%;border-collapse:collapse;font-size:13px}
.thist th{text-align:right;padding:7px 8px;color:var(--ink2);font-weight:700;font-size:11px;border-bottom:2px solid var(--line);white-space:nowrap}
.thist th:first-child,.thist td:first-child{text-align:left}
.thist td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.chartwrap{overflow:hidden;border-radius:var(--radius-sm)}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line2);border-radius:9px;overflow:hidden;margin-bottom:8px}
.seg button{border:none;background:none;padding:7px 13px;font-size:12px;font-weight:700;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}

.banner{background:var(--blue-bg);border:1px solid #cfe1f6;color:#1c4f8f;border-radius:var(--radius-sm);padding:10px 13px;font-size:13px;font-weight:600;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:24px;font-size:13px;font-weight:600;opacity:0;transition:.25s;z-index:200;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(20,36,47,.45);display:none;align-items:flex-end;justify-content:center;z-index:300}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:540px;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto;animation:up .22s ease}
.ex-modal{position:fixed;inset:0;background:rgba(20,36,47,.7);display:none;align-items:center;justify-content:center;z-index:400;padding:20px}
.ex-modal.show{display:flex}
.ex-sheet{background:var(--card);width:100%;max-width:960px;height:92vh;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:up .2s ease}
.ex-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ex-head b{flex:1;font-size:15px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#exFrame{flex:1;border:none;width:100%;background:#fff}
.ex-pin-row{display:flex;gap:8px;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--line);align-items:center}
.ex-pin-row .inp{flex:1;font-size:13px;padding:8px 10px}
.ex-pin-row .btn{padding:8px 12px;font-size:12px}
@media(max-width:640px){.ex-modal{padding:0}.ex-sheet{height:100vh;border-radius:0}}
@keyframes up{from{transform:translateY(30px)}to{transform:none}}
.sheet h3{font-size:17px;font-weight:800;margin-bottom:4px}
.searchres{padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:10px;align-items:center}
.searchres:active{background:var(--bg2)}
.searchres .srn{flex:1}.searchres .srn b{font-size:14px}.searchres .srn span{font-size:12px;color:var(--ink2)}
.empty{text-align:center;color:var(--ink3);padding:26px 10px;font-size:14px}
.note{font-size:12px;color:var(--ink3);line-height:1.5;margin-top:8px}
a.link{color:var(--accent-d);font-weight:700;text-decoration:none}
</style>
</head>
<body>
<header class="appbar">
  <div class="bar-top">

/* ----- meal macros + auto grocery (computed from meal items) ----- */
function mealRaw(m){
  let cal=0,P=0,C=0,F=0,fib=0;
  (m.items||[]).forEach(it=>{ if(it.free) return; fib+=itemFiber(it); if(!it.cal) return; cal+=it.cal;
    const t=it.m||'C'; const has=c=>t.indexOf(c)>=0;
    const n=(has('P')?1:0)+(has('C')?1:0)+(has('F')?1:0)||1, per=it.cal/n;
    if(has('P'))P+=per; if(has('C'))C+=per; if(has('F'))F+=per; });
  return {cal, p:P/4, c:C/4, f:F/9, fib};
}
// User overrides win over the estimated table; they persist and sync.
function mealFiberOf(m, fallback){
  const o=S.mealFiber&&S.mealFiber[mealFiberKey(m)];
  return o==null?fallback:o;
}
function mealMacros(m){
  const base=m._macros||(()=>{const r=mealRaw(m);return {cal:Math.round(r.cal),p:Math.round(r.p),c:Math.round(r.c),f:Math.round(r.f),fib:round(r.fib)};})();
  const fib=mealFiberOf(m, base.fib||0);
  return fib===base.fib?base:Object.assign({},base,{fib});
}
// Scale each plan's per-meal P/C/F so the day sums to the coach's stated target.
function normalizePlans(plans){
  plans.forEach(plan=>{
    const raws=plan.meals.map(mealRaw);
    let rp=0,rc=0,rf=0; raws.forEach(r=>{rp+=r.p;rc+=r.c;rf+=r.f;});
    const t=plan.target||{}, sp=(t.p&&rp)?t.p/rp:1, sc=(t.c&&rc)?t.c/rc:1, sf=(t.f&&rf)?t.f/rf:1;
    // Fiber is a measured absolute, not a share of the calorie split — never scaled.
    plan.meals.forEach((m,i)=>{ m._plan=plan.id;
      m._macros={cal:Math.round(raws[i].cal), p:Math.round(raws[i].p*sp), c:Math.round(raws[i].c*sc), f:Math.round(raws[i].f*sf), fib:round(raws[i].fib)}; });
  });
}
function categorize(food){
  const f=food.toLowerCase(), has=arr=>arr.some(k=>f.includes(k));
  if(f.includes('green bean')||f.includes('potato')) return 'Produce';
  if(has(['collagen','ump','protein powder','ultimate muscle','provosyn','muscle provider','protein balls','creatine'])) return 'Supplements/Other';
  if(has(['chicken','turkey','salmon','mahi','beef','steak','sirloin','pork','tilapia','cod','shrimp','tuna','white fish','fish','sausage','ground'])) return 'Meat & Protein';
  if(has(['egg','yogurt','cottage cheese','feta','chedd','cheese','almond milk','coconut milk','heavy whipping','butter'])) return 'Dairy & Refrigerated';
  if(has(['bread','pita','tortilla','english muffin','ezekiel','bun','kodiak','pancake'])) return 'Bakery';
  if(has(['frozen','edamame'])) return 'Frozen';
  if(has(['oat','quinoa','rice','bean','chickpea','almond','walnut','cashew','pinenut','peanut','nut butter','tahini','chia','flax','hummus','kind bar','perfect bar','cracker','graham','cereal','fiber one','rice cake','salsa','teriyaki','jelly','honey','syrup','chocolate','coconut','seed','oil','dressing','vinaigrette','pumpkin puree','wild rice','kidney','oyster'])) return 'Grocery/Pantry';
  return 'Produce';
}
const FRAC={'½':.5,'⅓':1/3,'⅔':2/3,'¼':.25,'¾':.75,'⅛':.125};
function parseQty(q){
  if(!q) return {num:1,unit:'',explicit:false};
  q=q.trim();
  let m=q.match(/^(\d+(?:\.\d+)?)\s*([½⅓⅔¼¾⅛])?\s*(.*)$/);
  if(m && (m[1]||m[2])) return {num:(m[1]?parseFloat(m[1]):0)+(m[2]?FRAC[m[2]]:0), unit:m[3].trim(), explicit:true};
  let fm=q.match(/^([½⅓⅔¼¾⅛])\s*(.*)$/);
  if(fm) return {num:FRAC[fm[1]], unit:fm[2].trim(), explicit:true};
  return {num:1, unit:q, explicit:false};
}
function buildGroceries(plan){
  const days=plan.days||7, agg={};
  (plan.meals||[]).forEach(m=>(m.items||[]).forEach(it=>{
    if(it.free) return;
    const {num,unit,explicit}=parseQty(it.q), key=it.f.toLowerCase().trim();
    if(!agg[key]) agg[key]={item:it.f, num:0, unit, aisle:categorize(it.f), explicit};
    agg[key].num+=num; if(explicit) agg[key].explicit=true;
  }));
  return Object.values(agg).map(a=>{
    let qty='as needed';
    if(a.explicit){ const w=Math.round(a.num*days*100)/100; qty=a.unit?w+' '+a.unit:''+w; }
    return {item:a.item, qty, aisle:a.aisle};
  });
}
function planGroceries(p){ return p.groceries || buildGroceries(p); }

function sparkHTML(ck){
  const pts=ck.map(c=>c.weightLbs).filter(v=>v!=null); if(pts.length<2)return'';
  const W=260,H=32,mn=Math.min(...pts),mx=Math.max(...pts),rng=(mx-mn)||1;
  const x=i=>i*W/(pts.length-1), y=v=>H-2-((v-mn)/rng)*(H-4);
  const path=pts.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:30px;margin-top:6px;display:block"><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}
function vitalityStreak(){
  let n=0;
  for(let i=0;i<400;i++){
    const d=new Date(); d.setDate(d.getDate()-i); const iso=d.toLocaleDateString('en-CA');
    const fl=S.foodLog[iso];
    const wk=weekKey(d); const trained=S.trainingLog[wk]&&Object.keys(S.trainingLog[wk]).length;
    const active=(fl&&(Object.keys(fl.mealsEaten||{}).length||(fl.extras||[]).length)) || (S.water&&S.water[iso]) || trained;
    if(active) n++;
    else if(i===0) continue;   // today not logged yet — don't break the streak
    else break;
  }
  return n;
}

/* ============================ FOOD ============================ */
let foodDate=todayISO();
let foodExp=new Set();
function toggleMealInfo(id){ foodExp.has(id)?foodExp.delete(id):foodExp.add(id); renderFood(); }
function toggleAllMeals(){ const p=curPlan(); if(p.meals.every(m=>foodExp.has(m.id))) foodExp.clear(); else p.meals.forEach(m=>foodExp.add(m.id)); renderFood(); }
function dayLog(d){
  if(!S.foodLog[d])S.foodLog[d]={mealsEaten:{},extras:[]};
  const lg=S.foodLog[d];
  if(!lg.mealsEaten)lg.mealsEaten={}; if(!lg.extras)lg.extras=[];
  return lg;
}
/* A meal slot holds one of three shapes: true (legacy), "HH:MM", or {t,swap} when
   an off-plan food was swapped in. These three read it without caring which. */
function mealSwap(v){ return (v&&typeof v==='object'&&v.swap)?v.swap:null; }
function mealTime(v){ return (v&&typeof v==='object')?(v.t||''):(v===true?'':(v||'')); }
function slotMacros(m,v){ const sw=mealSwap(v); return sw?{cal:sw.cal||0,p:sw.p||0,c:sw.c||0,f:sw.f||0,fib:sw.fib||0}:mealMacros(m); }
function dayTotals(d){
  const p=curPlan(),lg=S.foodLog[d]||{},me=lg.mealsEaten||{};
  const t={cal:0,p:0,c:0,f:0,fib:0},seen={};
  p.meals.forEach(m=>{const v=me[m.id]; if(!v)return; seen[m.id]=1;
    const mm=slotMacros(m,v);t.cal+=mm.cal;t.p+=mm.p;t.c+=mm.c;t.f+=mm.f;t.fib+=mm.fib||0;});
  // Slots not in the current plan: a bare check has no macros to attribute, but a swap
  // carries its own — that's real food, and it shouldn't vanish on a plan switch.
  Object.keys(me).forEach(k=>{ if(seen[k])return; const sw=mealSwap(me[k]);
    if(sw){t.cal+=sw.cal||0;t.p+=sw.p||0;t.c+=sw.c||0;t.f+=sw.f||0;t.fib+=sw.fib||0;} });
  (lg.added||[]).forEach(a=>{t.cal+=a.cal||0;t.p+=a.p||0;t.c+=a.c||0;t.f+=a.f||0;t.fib+=a.fib||0;});
  (lg.extras||[]).forEach(e=>{t.cal+=e.cal||0;t.p+=e.p||0;t.c+=e.c||0;t.f+=e.f||0;t.fib+=e.fib||0;});
  return t;
}

    <div class="rings" style="margin-top:16px">

  // Eating window + fast (intermittent fasting)

    }

      main+=`<div><div class="tiny">Fast since last night</div><b style="font-size:16px;color:${fast>=14*60?'var(--good)':'var(--ink)'}">${fmtDur(fast)}</b></div>`;

  main+=`<div class="card"><div class="row"><h2 style="margin:0;flex:1">Plan meals${isToday?' · today':''}</h2><button class="btn ghost" style="padding:2px 4px;font-size:12px" onclick="toggleAllMeals()">${p.meals.every(m=>foodExp.has(m.id))?'Hide recipes':'Show recipes'}</button></div>`;
  const skipped=p.meals.filter(m=>isSkipped(lg,m.id));
  p.meals.filter(m=>!isSkipped(lg,m.id)).forEach(m=>{
    const eatenVal=lg.mealsEaten[m.id], eaten=eatenVal?'eaten':'', sw=mealSwap(eatenVal);
    const mm=slotMacros(m,eatenVal), planMM=mealMacros(m), exp=foodExp.has(m.id);
    const timeLabel=fmtHM(mealTime(eatenVal));
    const title=sw?esc(m.name)+' <span style="font-weight:600;color:var(--blue)">→ '+esc(sw.name)+'</span>':esc(m.name);
    main+=`<div class="meal ${eaten}">
      <div class="check" onclick="toggleMeal('${m.id}')" style="${eaten?'background:var(--accent);border-color:var(--accent)':''}"><svg viewBox="0 0 24 24" style="${eaten?'opacity:1':''}"><path d="M5 13l4 4L19 7"/></svg></div>
      <div class="mn" onclick="toggleMeal('${m.id}')"><b>${title}</b><div class="mm">${mm.cal} cal · ${mm.p}P / ${mm.c}C / ${mm.f}F · <span class="fib-chip${mealFiberOf(m,null)==null?' est':''}" onclick="event.stopPropagation();editMealFiber('${m.id}')" title="${mealFiberOf(m,null)==null?'Estimated — tap to correct':'Your value'}">${mm.fib||0}g fiber</span>${timeLabel?' · <span class="meal-time" onclick="event.stopPropagation();editMealTime(\''+m.id+'\')">🕐 '+timeLabel+'</span>':eaten?' · <span class="meal-time" onclick="event.stopPropagation();editMealTime(\''+m.id+'\')">set time</span>':''}</div></div>
      <button class="mealinfo" onclick="swapMealModal('${m.id}')" title="Swap in something else">⇄</button>
      <button class="mealinfo" onclick="toggleMealInfo('${m.id}')" title="Ingredients">${exp?'▲':'▼'}</button>
      <button class="mealinfo" onclick="skipMeal('${m.id}')" title="Skip this meal">×</button>

  const tabs=[['recent','Recent'],['recipes','Recipes'],['search','Search'],['barcode','Barcode'],['custom','Custom']];
  return `<h3>${title}</h3>
    <p class="muted" style="font-size:12px;margin:2px 0 10px">${fmtDate(foodDate)}${_fpMode==='swap'?' · replaces this meal on your plan':''}</p>
    <div class="row" style="gap:4px;flex-wrap:wrap;margin-bottom:10px">${tabs.map(([k,l])=>`<button class="btn ${_fpTab===k?'':'sec'}" style="flex:1;padding:6px 2px;font-size:12px" onclick="fpTab('${k}')">${l}</button>`).join('')}</div>
    <div class="row" id="fpMultRow" style="gap:4px;align-items:center;margin-bottom:10px">${fpMultInner()}</div>
    <div id="fpBody">${fpBody()}</div>`;
}
function fpRows(list,empty){
  window._fpItems=list;
  if(!list.length)return `<div class="empty">${empty}</div>`;
  return list.map((f,i)=>{
    const sub=[f.brand,f.basis,f.note].filter(Boolean).join(' · ');
    return `<div class="searchres" onclick="fpPick(${i})"><div class="srn"><b>${esc(f.name)}</b><br><span>${sub?esc(sub)+' — ':''}${f.cal} cal · ${f.p}P/${f.c}C/${f.f}F${f.fib?' · '+f.fib+'g fiber':''}</span></div><div style="color:var(--accent-d);font-weight:800">${_fpMode==='swap'?'⇄':'＋'}</div></div>`;
  }).join('');
}
function fpBody(){
  if(_fpTab==='recent') return fpRows(recentFoods(),'Nothing logged yet — use Search or Custom, and it\'ll show up here next time.');
  if(_fpTab==='recipes') return `<input class="inp" id="fpRQ" placeholder="🔍 Search your recipes…" oninput="fpRenderRecipes(this.value)" style="margin-bottom:8px"><div id="fpRList">${fpRecipeRows('')}</div>`;
  if(_fpTab==='search') return `<div class="row" style="gap:8px"><input class="inp" id="fpQ" placeholder="e.g. chobani vanilla" onkeydown="if(event.key==='Enter')fpRunSearch()"><button class="btn" onclick="fpRunSearch()">Go</button></div>
    <p class="muted" style="font-size:12px;margin:8px 0 0">Powered by Open Food Facts (free database).</p><div id="fpRes" style="margin-top:10px"></div>`;
  if(_fpTab==='barcode') return `<div class="row" style="gap:8px"><input class="inp" id="fpBC" inputmode="numeric" placeholder="Type the barcode digits" onkeydown="if(event.key==='Enter')fpRunBarcode()"><button class="btn" onclick="fpRunBarcode()">Look up</button></div>
    <p class="muted" style="font-size:12px;margin:8px 0 0">The 8–14 digits under the barcode. Once found, it lands in Recent — you only type it once.</p><div id="fpRes" style="margin-top:10px"></div>`;
  return macroFields('cf',null)+`<button class="btn" style="width:100%;margin-top:12px" onclick="fpCustom()">${_fpMode==='swap'?'Swap this in':'Add'}</button>`;
}
function fpRecipeRows(q){
  q=(q||'').toLowerCase().trim(); const out=[];
  S.plans.forEach(pl=>(pl.meals||[]).forEach(m=>{
    if(q&&!m.name.toLowerCase().includes(q)&&!pl.name.toLowerCase().includes(q))return;
    const mm=mealMacros(m);
    out.push({name:m.name, brand:pl.name, cal:mm.cal, p:mm.p, c:mm.c, f:mm.f, fib:mm.fib, src:{k:'plan',planId:pl.id,mealId:m.id}});
  }));
  return fpRows(out.slice(0,40),'No matching recipes.');
}
function fpRenderRecipes(q){ const el=$('#fpRList'); if(el)el.innerHTML=fpRecipeRows(q); }
async function fpRunSearch(){
  const q=$('#fpQ').value.trim(); if(!q)return; const box=$('#fpRes');
  box.innerHTML='<div class="empty">Searching…</div>';
  try{ box.innerHTML=fpRows(await offSearch(q),'No matches. Try the Custom tab.'); }
  catch(e){ box.innerHTML='<div class="empty">Search failed (offline?). Use the Custom tab.</div>'; }
}
async function fpRunBarcode(){
  const raw=$('#fpBC').value, box=$('#fpRes');
  box.innerHTML='<div class="empty">Looking up…</div>';
  try{
    const r=await offBarcode(raw);
    if(r.bad){ box.innerHTML='<div class="empty">That doesn\'t look like a barcode — it should be 8–14 digits.</div>'; return; }
    if(!r.food){ box.innerHTML='<div class="empty">Not in the database. Add it on the Custom tab and it\'ll be in Recent from then on.</div>'; return; }
    box.innerHTML=fpRows([r.food],'');
  }catch(e){ box.innerHTML='<div class="empty">Lookup failed (offline?). Use the Custom tab.</div>'; }
}
function fpPick(i){ const f=window._fpItems[i]; if(f)commitFood(scaleFood(f,_fpMult)); }
function fpCustom(){ const f=readMacroFields('cf'); if(!f){toast('Give it a name');return;} commitFood(scaleFood(f,_fpMult)); }
function commitFood(f){
  if(_fpMode==='swap'&&_fpSlot) return applyMealSwap(_fpSlot,f);
  dayLog(foodDate).extras.push({name:f.name, cal:Math.round(f.cal||0), p:round(f.p||0), c:round(f.c||0), f:round(f.f||0),
    fib:round(f.fib||0), src:f.src||null, time:foodDate===todayISO()?nowHM():'12:00'});
  save(); closeModal(); renderFood(); toast('Added '+f.name);
}
/* Recents are derived from history, not stored — so they sync for free and never
   drift from what was actually logged. */
function quickAddRecent(i){ const f=recentFoods(4)[i]; if(!f)return;
  _fpMode='extra'; _fpSlot=null; _fpMult=1; commitFood(f); }
function recentFoods(limit){
  limit=limit||14; const map=new Map(), now=Date.now();
  Object.keys(S.foodLog).sort().slice(-60).forEach(d=>{
    const lg=S.foodLog[d]||{}, age=Math.max(0,(now-new Date(d+'T12:00').getTime())/864e5);
    const bump=f=>{ if(!f||!f.name)return; const k=f.name.toLowerCase().trim();
      const e=map.get(k)||{n:0,age:1e9};
      Object.assign(e,{name:f.name,cal:f.cal||0,p:f.p||0,c:f.c||0,f:f.f||0,fib:f.fib||0,src:f.src||e.src});
      e.n++; e.age=Math.min(e.age,age); map.set(k,e); };
    (lg.extras||[]).forEach(bump);
    Object.values(lg.mealsEaten||{}).forEach(v=>{ const sw=mealSwap(v); if(sw)bump(sw); });
  });
  return [...map.values()].map(e=>Object.assign(e,{note:e.n>1?e.n+'× logged':''}))
    .sort((a,b)=>(b.n*2-b.age/7)-(a.n*2-a.age/7)).slice(0,limit);
}

/* ============================ RECIPES ============================ */
let recipeSearch="", recipeMacroFilter="all";
function renderRecipes(){
  const q=recipeSearch.toLowerCase().trim(), filter=recipeMacroFilter;
  // flatten all meals across all plans
  const all=[];
  S.plans.forEach(pl=>(pl.meals||[]).forEach(m=>all.push({plan:pl, meal:m, macros:mealMacros(m)})));
  // filter by search (name, plan, ingredient) + macro focus
  const matches=all.filter(r=>{
    if(filter==='hp' && !(r.macros.p>=25)) return false;
    if(filter==='lc' && !(r.macros.c<=25)) return false;
    if(filter==='lf' && !(r.macros.f<=15)) return false;
    if(!q) return true;
    if(r.meal.name.toLowerCase().includes(q)) return true;
    if(r.plan.name.toLowerCase().includes(q)) return true;
    return (r.meal.items||[]).some(it=>(it.f||'').toLowerCase().includes(q));
  });
  let html=`<div class="card" style="position:sticky;top:0;z-index:5">
    <div class="row" style="gap:10px;align-items:center"><h2 style="margin:0;flex:1">📖 Recipe library <span class="tiny" style="font-weight:600;color:var(--ink3);margin-left:6px">${matches.length} of ${all.length}</span></h2></div>
    <input class="inp" placeholder="🔍 Search by recipe, ingredient, or plan…" value="${esc(recipeSearch)}" oninput="recipeSearch=this.value;renderRecipes()" style="margin-top:10px">
    <div class="seg" style="margin-top:10px">
      <button class="${filter==='all'?'on':''}" onclick="recipeMacroFilter='all';renderRecipes()">All</button>
      <button class="${filter==='hp'?'on':''}" onclick="recipeMacroFilter='hp';renderRecipes()">High protein</button>
      <button class="${filter==='lc'?'on':''}" onclick="recipeMacroFilter='lc';renderRecipes()">Low carb</button>
      <button class="${filter==='lf'?'on':''}" onclick="recipeMacroFilter='lf';renderRecipes()">Low fat</button>
    </div>
  </div>`;

  if(!matches.length){
    html+=`<div class="card"><div class="empty">No recipes match.${q?' Try a different search.':''}</div></div>`;
  } else {
    html+=`<div class="recipe-grid">`;
    matches.forEach((r,i)=>{
      const m=r.meal, mm=r.macros;
      html+=`<div class="recipe-card">
        <div class="recipe-head">
          <div style="flex:1;min-width:0">
            <div class="recipe-name">${esc(m.name)}</div>
            <div class="recipe-plan">${esc(r.plan.name)}</div>
          </div>
          <div class="recipe-macros">
            <div class="rm-cal"><b>${mm.cal}</b><span>cal</span></div>
            <div class="rm-line"><span style="color:var(--pro)">${mm.p}P</span> · <span style="color:var(--carb)">${mm.c}C</span> · <span style="color:var(--fat)">${mm.f}F</span></div>
          </div>
        </div>
        ${(m.items||[]).length?`<div class="recipe-ings">${m.items.map(it=>`<div class="ming"><span class="mq">${esc(it.q||'—')}</span><span>${esc(it.f)}</span></div>`).join('')}</div>`:''}
        <div class="row" style="gap:8px;margin-top:10px">
          <button class="btn" style="flex:1" onclick="addRecipeToToday('${r.plan.id}','${m.id}')">＋ Add to today</button>
          <button class="btn sec" onclick="useRecipeForMeal('${r.plan.id}','${m.id}')" title="Swap into a plan-meal slot for today">Swap…</button>
        </div>
      </div>`;
    });
    html+=`</div>`;
  }
  $('#p-recipes').innerHTML=html;
}
function addRecipeToToday(planId, mealId){
  const pl=S.plans.find(p=>p.id===planId); const m=pl&&(pl.meals||[]).find(x=>x.id===mealId);
  if(!m){toast('Recipe not found');return;}
  const mm=mealMacros(m);
  dayLog(todayISO()).extras.push({name:m.name, cal:mm.cal, p:mm.p, c:mm.c, f:mm.f, time:nowHM()});
  save(); toast('Added '+m.name+' to today');
}
function useRecipeForMeal(planId, mealId){
  const pl=S.plans.find(p=>p.id===planId); const m=pl&&(pl.meals||[]).find(x=>x.id===mealId);
  if(!m)return;
  const mm=mealMacros(m);
  const opts=curPlan().meals.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');
  openModal(`<h3>Swap into a meal slot</h3>
    <p class="muted" style="font-size:13px;margin:4px 0 10px">Replace a plan meal with <b>${esc(m.name)}</b> on <b>${fmtDate(foodDate)}</b>.</p>
    <label class="fld">Replace which meal slot?</label>
    <select class="sel" id="swapSel">${opts}</select>
    <div class="tiny" style="margin-top:8px">Will log ${mm.cal} cal · ${mm.p}P / ${mm.c}C / ${mm.f}F</div>
    <button class="btn" style="width:100%;margin-top:12px" onclick="doRecipeSwap('${planId}','${mealId}')">Swap</button>`);
}
function doRecipeSwap(planId, mealId){
  const slot=$('#swapSel').value; const pl=S.plans.find(p=>p.id===planId); const m=pl&&(pl.meals||[]).find(x=>x.id===mealId);
  if(!m){closeModal();return;}
  const mm=mealMacros(m);
  applyMealSwap(slot,{name:m.name, cal:mm.cal, p:mm.p, c:mm.c, f:mm.f, fib:mm.fib, src:{k:'plan',planId:planId,mealId:mealId}});
}

/* ============================ TRAIN ============================ */
function renderTrain(){
  const w=curWorkout(),wk=weekKey();S.trainingLog[wk]=S.trainingLog[wk]||{};
  const log=S.trainingLog[wk];
  const trainDays=w.days.filter(d=>!d.rest);
  const done=trainDays.filter(d=>log[dayKey(d.id)]).length;
  const isSwap=(v)=>v&&typeof v==='object'&&v.swap;
  let main=`<div class="card"><div class="row"><div style="flex:1">
      <label class="fld" style="margin-top:0">Program</label>
      <select class="sel" onchange="S.currentWorkoutId=this.value;save();renderTrain()">${S.workouts.map(x=>`<option value="${x.id}" ${x.id===w.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
    </div><div style="text-align:right"><div class="tiny">This week</div><b style="font-size:18px;color:var(--accent-d)">${done}/${trainDays.length}</b></div></div></div>`;

  // This-week summary (planned workouts + Strava activity)
  const wkAgo=Date.now()-7*864e5;
  const recent=(S.activities||[]).filter(a=>new Date(a.date).getTime()>wkAgo);
  const mins=recent.reduce((s,a)=>s+(a.durationMin||0),0);
  const cals=recent.reduce((s,a)=>s+(a.calories||0),0);
  const dist=recent.reduce((s,a)=>s+(a.distanceKm||0),0);
  main+=`<div class="card"><h2>📅 This week</h2>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center">
      <div><div style="font-size:23px;font-weight:800;color:var(--accent-d)">${done}<span style="font-size:13px;color:var(--ink3)">/${trainDays.length}</span></div><div class="tiny">Workouts</div></div>
      <div><div style="font-size:23px;font-weight:800">${recent.length}</div><div class="tiny">Sessions</div></div>
      <div><div style="font-size:23px;font-weight:800">${mins}</div><div class="tiny">Active min</div></div>
      <div><div style="font-size:23px;font-weight:800">${cals||'—'}</div><div class="tiny">Calories</div></div>
    </div>
    ${dist?`<div class="tiny" style="text-align:center;margin-top:9px">🏃 ${round(dist*0.621371,1)} mi this week</div>`:''}
    ${!S.strava.workerUrl?`<div class="tiny" style="text-align:center;margin-top:9px;color:var(--ink3)">Sessions/min/cal fill in once Strava is synced</div>`:''}
  </div>`;

  w.days.forEach(d=>{
    if(d.rest){main+=`<div class="card" style="padding:0"><div class="rest">🧘 ${esc(d.label)}</div></div>`;return;}
    const v=log[dayKey(d.id)], dn=v?'done':'', sw=isSwap(v);
    const checkStyle = sw ? 'background:var(--blue);border-color:var(--blue)' : (dn?'background:var(--accent);border-color:var(--accent)':'');
    main+=`<div class="card"><div class="day"><div class="dh">
      <div class="check ${dn}" onclick="toggleDay('${d.id}')" style="${checkStyle}"><svg viewBox="0 0 24 24" style="${dn?'opacity:1':''}"><path d="${sw?'M7 12h10':'M5 13l4 4L19 7'}"/></svg></div>
      <b style="flex:1">${esc(d.label)}</b>
      <button class="btn ghost" style="padding:2px 6px;font-size:12px;color:var(--blue)" onclick="swapDayModal('${d.id}','${esc(d.label).replace(/'/g,"\\'")}')">${sw?'Edit swap':'Swap'}</button>
      </div>`;
    if(sw){
      const a=v.swap;
      main+=`<div class="swap-line">🔄 Swapped with <b>${esc(a.name||a.type||'activity')}</b>${a.durationMin?' · '+a.durationMin+' min':''} <span class="sw-rm" onclick="clearSwap('${d.id}')">×</span></div>`;
    } else {
      main+=`<div class="warmup">🤸 Warm-up: 5 min + 5–10 min stretching the muscles you'll train</div>`;
    }
    const dayIsCircuit=/circuit/i.test(d.label);
    // helper that renders one exercise row; hideReps=true when the enclosing group's header already shows reps
    const renderExRow=(ex, exIdx, groupIsCircuit, hideReps)=>{
      const n=parseInt(ex.sets)||4;
      const done=(S.setLog&&S.setLog[wk]&&S.setLog[wk][d.id]&&S.setLog[wk][d.id][exIdx])||[];
      const unit=(groupIsCircuit||dayIsCircuit)?'R':'S';
      const boxes=Array.from({length:n},(_,si)=>{
        const on=done[si]?' on':'';
        return `<span class="set-box${on}" onclick="toggleSet('${d.id}',${exIdx},${si})" aria-label="${unit}${si+1}" title="${(groupIsCircuit||dayIsCircuit)?'Round':'Set'} ${si+1}"></span>`;
      }).join('');
      const nameSafe=esc(ex.name).replace(/'/g,"\\'");
      const curW=getCurrentWeight(ex.name);
      const lastW=getLastWeight(ex.name);
      const arrow=curW!=null && lastW ? (curW>lastW.w?' <span class="wt-up">▲</span>':(curW<lastW.w?' <span class="wt-dn">▼</span>':'')) : '';
      const lastPill = lastW ? `<span class="wt-last" onclick="showWeightHistory('${nameSafe}')" title="Tap for history">📈 ${lastW.w} lb</span>` : '';
      const srSpan = hideReps ? '' : `<span class="sr">${ex.sets?esc(ex.sets)+' × ':''}${esc(ex.reps)} reps</span>`;
      return `<div class="ex"${sw?' style="opacity:.45"':''}>
        <a href="#" onclick="event.preventDefault();openExercise('${nameSafe}')">${esc(ex.name)}</a>
        ${srSpan}
        <span class="wt-wrap">
          <input class="wt-inp" type="number" inputmode="decimal" step="0.5" value="${curW??''}" placeholder="lb" onchange="setWeight('${nameSafe}',this.value)" title="Weight today">${arrow}
          ${lastPill}
        </span>
        <span class="set-boxes">${boxes}</span>
      </div>`;
    };

    if(d.groups && d.groups.length){
      // Grouped render: header per group + exercise rows without redundant reps
      d.groups.forEach(g=>{
        if(g.type==='cardio'){
          main+=`<div class="cardio">🔥 ${esc(g.label||'Mid-workout cardio')}${g.note?': '+esc(g.note):''}</div>`;
          return;
        }
        const isC=g.type==='circuit';
        const setsPart=isC?`${g.rounds||4} rounds`:`${g.sets||4} sets`;
        const restPart=g.rest?` · rest ${esc(g.rest)}`:'';
        const label=esc(g.label||(isC?'Circuit':'Straight Sets'));
        const badge=isC?'<span class="grp-badge circuit">CIRCUIT</span>':(g.type==='superset'?'<span class="grp-badge super">SUPERSET</span>':'<span class="grp-badge straight">STRAIGHT</span>');
        main+=`<div class="grp-head">
          <div class="grp-title">${badge} ${label}</div>
          <div class="grp-meta">${setsPart} · ${esc(g.reps||'')} reps${restPart}</div>
          ${g.note?`<div class="grp-note">💡 ${esc(g.note)}</div>`:''}
        </div>`;
        (g.indices||[]).forEach(exIdx=>{
          if(d.exercises[exIdx]) main+=renderExRow(d.exercises[exIdx], exIdx, isC, true);
        });
      });
    } else {
      // Legacy flat render (no groups defined for this day yet)
      d.exercises.forEach((ex,exIdx)=>{
        main+=renderExRow(ex, exIdx, dayIsCircuit, false);
      });
    }
    if(d.cardio&&!sw) main+=`<div class="cardio">🔥 ${esc(d.cardio)}</div>`;
    main+=`</div></div>`;
  });

  // side column — notes on top, then Strava recent activity
  let side=notesCard(todayISO())+`<div class="card"><h2>📡 Recent activity ${S.strava.workerUrl?'':'<span class="pill" style="background:var(--line);color:var(--ink2);margin-left:auto">off</span>'}</h2>`;
  if(!S.strava.workerUrl){
    side+=`<p class="muted" style="font-size:13px">Connect Strava to pull your Apple Watch workouts here.</p><button class="btn sec" style="margin-top:10px;width:100%" onclick="go('data')">Connect Strava →</button>`;
  }else{
    side+=`<button class="btn" style="width:100%" onclick="syncStrava()">↻ Sync${S.strava.lastSync?' · '+timeAgo(S.strava.lastSync):''}</button>`;
    if(recent.length){
      side+=`<div class="banner" style="margin-top:12px;background:var(--accent-bg);border-color:#bfe9e1;color:var(--accent-d)">Last 7 days: <b>${recent.length}</b> sessions · <b>${mins}</b> min · <b>${cals||'—'}</b> cal</div>`;
      recent.forEach(a=>{
        const emo=actEmoji(a.type),dt=new Date(a.date).toLocaleDateString('en-US',{month:'short',day:'numeric'});
        side+=`<div class="act"><div class="aemoji">${emo}</div><div class="an"><b>${esc(a.name||a.type)}</b><div class="am">${dt} · ${a.durationMin||0} min${a.distanceKm?' · '+round(a.distanceKm*0.621371,2)+' mi':''}</div></div>
          <div class="astat">${a.calories?a.calories+' cal':''}${a.avgHR?'<br>♥ '+a.avgHR:''}</div></div>`;
      });
    } else side+=`<div class="tiny" style="margin-top:12px;padding:4px 2px">No workouts in the last 7 days.</div>`;
  }
  side+=`</div>`;
  $('#p-train').innerHTML=`<div class="split"><div class="col-main">${main}</div><aside class="col-side">${side}</aside></div>`;
}
/* ---- Exercise weight logging (progressive overload) ---- */
function getCurrentWeight(name){
  const arr=(S.weightLog&&S.weightLog[name])||[];
  return (arr[0]&&arr[0].d===todayISO()) ? arr[0].w : null;
}
function getLastWeight(name){
  const arr=(S.weightLog&&S.weightLog[name])||[];
  return (arr[0]&&arr[0].d===todayISO()) ? arr[1]||null : arr[0]||null;
}
function setWeight(name, val){
  S.weightLog=S.weightLog||{};
  const arr=(S.weightLog[name]||[]).slice();
  const today=todayISO();
  const v=val===''||val==null?null:+val;
  const idx=arr.findIndex(e=>e.d===today);
  if(v==null || isNaN(v)){
    if(idx>=0) arr.splice(idx,1);
  } else {
    if(idx>=0) arr[idx].w=v; else arr.unshift({d:today, w:v});
  }
  if(arr.length) S.weightLog[name]=arr; else delete S.weightLog[name];
  save(); renderTrain();
}
function showWeightHistory(name){
  const arr=(S.weightLog&&S.weightLog[name])||[];
  if(!arr.length){ toast('No history yet'); return; }
  const rows=arr.map((e,i)=>{
    const prev=arr[i+1];
    const delta=prev?(e.w-prev.w):null;
    const cls=delta==null?'':(delta>0?'wt-up':(delta<0?'wt-dn':''));
    const sign=delta==null?'':(delta>0?`+${delta}`:`${delta}`);
    return `<tr><td>${fmtDate(e.d)}</td><td style="text-align:right"><b>${e.w}</b> lb</td><td style="text-align:right;color:${delta>0?'var(--good)':(delta<0?'var(--bad)':'var(--ink3)')}">${sign}</td></tr>`;
  }).join('');
  openModal(`<h3>${esc(name)} — weight history</h3>
    <p class="muted" style="font-size:13px;margin:4px 0 12px">${arr.length} entr${arr.length===1?'y':'ies'}. Log another today to keep the streak going.</p>

let trendMetric='weightLbs', histOpen=false, fitOpen=false;
function renderProgress(){

  }else{

      <button class="${trendMetric==='waist'?'on':''}" onclick="trendMetric='waist';renderProgress()">Waist</button>
      <button class="${trendMetric==='restingHR'?'on':''}" onclick="trendMetric='restingHR';renderProgress()">Rest HR</button>
    </div>`;

    html+=`<div class="card"><h2>History</h2><div style="overflow-x:auto"><table class="thist"><thead><tr><th>Date</th><th>Weight</th><th>Waist</th><th>Chest</th><th>Hips</th><th>R HR</th></tr></thead><tbody>`;
    hshow.forEach(c=>{
      html+=`<tr><td>${fmtDate(c.date)}</td><td>${c.weightLbs??'—'}</td><td>${c.measurements?.waist??'—'}</td><td>${c.measurements?.chest??'—'}</td><td>${c.measurements?.hips??'—'}</td><td>${c.fitTest?.restingHR??'—'}</td></tr>`;
    });

    if(hrev.length>1) html+=`<button class="btn ghost" style="margin-top:6px" onclick="histOpen=!histOpen;renderProgress()">${histOpen?'Show less ▲':'Show all '+hrev.length+' check-ins ▾'}</button>`;
    html+=`</div>`;

    // Fitness tests (every 4 weeks)
    const fts=ck.filter(c=>c.fitTest);
    if(fts.length){
      const fa=fts[0].fitTest, fz=fts[fts.length-1].fitTest;
      const arrow=(a,b,lowerBetter)=>{ if(a==null||b==null||a===b)return''; const up=b>a; const better=lowerBetter?!up:up; return `<span style="color:${better?'var(--good)':'var(--bad)'};font-weight:700"> ${up?'▲':'▼'}</span>`; };
      html+=`<div class="card"><h2>🏃 Fitness tests · every 4 weeks</h2>

          <div><div class="tiny">1-mile</div><b style="font-size:18px">${fz.mileTime??'—'}${arrow(parseTime(fa.mileTime),parseTime(fz.mileTime),true)}</b></div>
          <div><div class="tiny">Plank</div><b style="font-size:18px">${fz.plankHold??'—'}${arrow(parseTime(fa.plankHold),parseTime(fz.plankHold),false)}</b></div>
        </div>
        <div style="overflow-x:auto"><table class="thist"><thead><tr><th>Date</th><th>Rest HR</th><th>Plank</th><th>1-mile</th><th>Sit&amp;Reach</th><th>Long Jump</th></tr></thead><tbody>`;
      const frev=[...fts].reverse(), fshow=fitOpen?frev:frev.slice(0,1);
      fshow.forEach(c=>{const f=c.fitTest;html+=`<tr><td>${fmtDate(c.date)}</td><td>${f.restingHR??'—'}</td><td>${f.plankHold??'—'}</td><td>${f.mileTime??'—'}</td><td>${f.sitReach??'—'}</td><td>${f.longJump??'—'}</td></tr>`;});

function fmtDate(iso){const[y,m,d]=iso.split('-');return `${+m}/${+d}/${y.slice(2)}`;}
function parseTime(s){ if(s==null)return null; s=String(s); if(s.includes(':')){const p=s.split(':');return (+p[0])*60+(+p[1]);} const m=s.match(/(\d+(\.\d+)?)/); return m?+m[1]:null; }
function getMetric(c,key){if(key==='weightLbs')return c.weightLbs;if(key==='waist')return c.measurements?.waist;if(key==='restingHR')return c.fitTest?.restingHR;return null;}
function trendSVG(ck,key){
  const pts=ck.map(c=>({d:c.date,v:getMetric(c,key)})).filter(p=>p.v!=null);
  if(pts.length<2)return `<div class="empty">Not enough data for this metric yet.</div>`;
  const W=700,H=200,pad=34;const vs=pts.map(p=>p.v);let mn=Math.min(...vs),mx=Math.max(...vs);if(mn===mx){mn-=1;mx+=1;}const rng=mx-mn;
  const x=i=>pad+i*(W-2*pad)/(pts.length-1);const y=v=>H-pad-((v-mn)/rng)*(H-2*pad);
  const col=key==='restingHR'?'var(--fat)':key==='waist'?'var(--carb)':'var(--accent)';
  let path=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  let area=path+` L${x(pts.length-1)} ${H-pad} L${x(0)} ${H-pad} Z`;
  let dots=pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3" fill="${col}"/>`).join('');
  const lblFirst=fmtDate(pts[0].d),lblLast=fmtDate(pts[pts.length-1].d);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;background:var(--bg2);border-radius:10px">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".18"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#g)"/><path d="${path}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/>${dots}
    <text x="${pad}" y="${H-10}" font-size="12" fill="#90a2b1">${lblFirst}</text>
    <text x="${W-pad}" y="${H-10}" font-size="12" fill="#90a2b1" text-anchor="end">${lblLast}</text>
    <text x="${pad}" y="20" font-size="12" fill="#90a2b1">${round(mx,1)}</text>
    <text x="${pad}" y="${H-pad+2}" font-size="12" fill="#90a2b1">${round(mn,1)}</text></svg>`;
}
function checkinDue(ck){
  if(!ck.length)return false;const last=new Date(ck[ck.length-1].date);const days=(Date.now()-last)/864e5;return days>=14;
}

function importFile(e){

    if(j.vision)S.vision=j.vision;

    if(j.meditation)S.meditation=Object.assign(S.meditation||{},j.meditation);
    if(j.setLog)S.setLog=Object.assign(S.setLog||{},j.setLog);
    if(j.exerciseVideos)S.exerciseVideos=Object.assign(S.exerciseVideos||{},j.exerciseVideos);
    if(j.weightLog)S.weightLog=Object.assign(S.weightLog||{},j.weightLog);
    save();renderData();toast('Imported '+(j.checkins?j.checkins.length+' check-ins':'data'));
  }catch(err){toast('Could not read file');}};
  rd.readAsText(f);
}

function ytIdFromUrl(url){
  if(!url)return null;
  const m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|v\/))([A-Za-z0-9_-]{11})/);
  return m?m[1]:(/^[A-Za-z0-9_-]{11}$/.test(url.trim())?url.trim():null);
}
function getExerciseVideoId(name){
  const pinned=S.exerciseVideos&&S.exerciseVideos[name];
  if(pinned) return pinned;
  return EXERCISE_VIDEO_SEED[name]||null;
}

let _exCurrent="";
function openExercise(name){
  _exCurrent=name;
  $('#exModalTitle').textContent=name;
  hidePinField();
  const vid=getExerciseVideoId(name);
  if(vid){
    const embed='https://www.youtube.com/embed/'+vid+'?rel=0&modestbranding=1';
    $('#exFrame').src=embed;
    $('#exModalOpen').href='https://www.youtube.com/watch?v='+vid;
  } else {
    const search='https://www.youtube.com/results?search_query='+encodeURIComponent(name+' exercise form');
    $('#exFrame').src='about:blank';
    $('#exModalOpen').href=search;
    showPinField(); // no video yet — prompt user to pin one
  }
  $('#exModal').classList.add('show');
  document.body.style.overflow='hidden';
}
function closeExercise(){
  $('#exModal').classList.remove('show');
  $('#exFrame').src='about:blank';
  hidePinField();
  document.body.style.overflow='';
  _exCurrent="";
}
function showPinField(){
  const cur=S.exerciseVideos&&S.exerciseVideos[_exCurrent];
  $('#exPinUrl').value=cur?'https://youtu.be/'+cur:'';
  $('#exPinRow').style.display='flex';
  setTimeout(()=>$('#exPinUrl').focus(),50);
}
function hidePinField(){ $('#exPinRow').style.display='none'; }
function savePinnedVideo(){
  const url=$('#exPinUrl').value.trim();
  const id=ytIdFromUrl(url);
  if(!id){ toast('Paste a YouTube URL (or 11-char video ID)'); return; }
  S.exerciseVideos=S.exerciseVideos||{};
  S.exerciseVideos[_exCurrent]=id;
  save();
  $('#exFrame').src='https://www.youtube.com/embed/'+id+'?rel=0&modestbranding=1';
  $('#exModalOpen').href='https://www.youtube.com/watch?v='+id;
  hidePinField();
  toast('Pinned');
}
function unpinVideo(){
  if(!S.exerciseVideos||!S.exerciseVideos[_exCurrent]){ toast('Nothing pinned'); return; }
  delete S.exerciseVideos[_exCurrent]; save();
  // reopen to reflect fallback
  openExercise(_exCurrent);
  toast('Cleared');
}

/* ============================ BOOT ============================ */
async function boot(){
  // grocery handoff via #g=
  if(location.hash.startsWith('#g=')){
    try{const run=dec(location.hash.slice(3));S.groceryRun=run;save();history.replaceState(null,'',location.pathname);toast('Grocery list loaded');go('grocery');return;}catch(e){}
  }
  go('home');
  // pull latest from cloud (if configured), then re-render current page
  if(S.cloud&&S.cloud.url&&S.cloud.token){
    const ok=await cloudPull();
    if(ok){ const active=document.querySelector('.page.active'); const pg=active?active.id.replace('p-',''):'home';
      ({home:renderHome,grocery:renderGrocery,food:renderFood,recipes:renderRecipes,train:renderTrain,progress:renderProgress,data:renderData}[pg]||renderHome)(); }
  }
}
boot();
